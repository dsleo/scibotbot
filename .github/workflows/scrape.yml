name: Scrape sci-bot.ru questions

on:
  push:
  workflow_dispatch:
  schedule:
    # GitHub's scheduler is best-effort and drops most runs on low-traffic repos, and the
    # site's feed only holds the latest 32 answers. Schedule often; dedup makes extra runs
    # free, and the job commits only when there is new data.
    - cron: '*/10 * * * *'

permissions:
  contents: write

# Never run two scrapes at once: a scheduled run and a push could race on data/.
concurrency:
  group: scrape
  cancel-in-progress: false

jobs:
  scrape:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install shot-scraper and Chromium
        run: |
          pip install shot-scraper
          shot-scraper install

      - name: Scrape rendered "réponses récentes" feed
        run: |
          # The feed hydrates over WebSocket, so extract.js polls until items appear
          # (up to 45s). On maintenance or timeout it returns [] and the merge is a no-op.
          cat > extract.js <<'JS'
          new Promise((resolve) => {
            const deadline = Date.now() + 45000;
            const grab = () => Array.from(document.querySelectorAll('a.recent-answered-q[href]')).map((a) => {
              const text = a.querySelector('.recent-answered-q-text');
              const when = a.querySelector('.recent-answered-when');
              const topics = a.querySelector('.recent-answered-topics');
              return {
                href: a.getAttribute('href'),
                question: (text ? text.innerText : a.innerText).trim(),
                answered_at_utc: when ? when.dataset.when : null,
                topics: topics ? topics.innerText.replace(/^\s*·\s*/, '').split(',').map((s) => s.trim()).filter(Boolean) : [],
              };
            });
            const tick = () => {
              const items = grab();
              if (items.length || Date.now() > deadline) resolve(items);
              else setTimeout(tick, 1000);
            };
            tick();
          })
          JS
          shot-scraper javascript https://sci-bot.ru -i extract.js > latest.json || {
            echo "::warning::Scrape failed (site down or in maintenance); archive left unchanged."
            echo '[]' > latest.json
          }
          rm extract.js

      - name: Merge into daily data files, commit and push only if data/ changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          # Merge on top of the freshest origin/main. If another run pushed first,
          # reset, re-merge the same scrape, and try again. `clean` drops a day file
          # a previous attempt created, which `reset --hard` would leave behind.
          for attempt in 1 2 3; do
            git fetch origin main
            git reset -q --hard origin/main
            git clean -fdq data
            out=$(python3 scripts/merge.py)
            echo "$out"
            added=$(echo "$out" | sed -n 's/^Added \([0-9]*\) .*/\1/p')
            git add data
            if git diff --staged --quiet; then
              echo "No new questions; nothing to commit."
              exit 0
            fi
            git commit -q -m "chore: add ${added} new question(s) to archive"
            if git push origin HEAD:main; then
              exit 0
            fi
            echo "Push rejected (attempt $attempt); retrying on fresh main."
          done
          echo "::error::Gave up after 3 push attempts."
          exit 1
